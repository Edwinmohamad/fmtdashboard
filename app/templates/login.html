<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Sign In — FMT Operations Dashboard</title><link rel="stylesheet" href="/static/app.css?v=2.8.13"></head>
<body class="login-body">
<a class="lang-switch" href="/lang/{{ 'id' if lang=='en' else 'en' }}">{{ 'ID' if lang=='en' else 'EN' }}</a>
<div class="login-shell single">
  <section class="login-panel">
    <div class="login-form-wrap">
      <div class="login-brand"><div class="logo-wrap"><img src="/brand/logo" alt="BDX" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="logo-mark" style="display:none">BDX</div></div><div><b>{{t('login.division_full')}}</b><span>{{t('login.badge',site=settings.get('site','TBS') if settings else 'TBS')}}</span></div></div>
      <h2>{{t('login.welcome')}}</h2><p class="login-subtitle">{{t('login.subtitle')}}</p>
      {% if error %}<div class="alert danger">{{error}}</div>{% endif %}
      <form method="post" action="/login" class="stack login-form">
        <label><span>{{t('login.username')}}</span><input name="username" autocomplete="username" placeholder="{{t('login.username_ph')}}" required autofocus></label>
        <label><span>{{t('login.password')}}</span><input name="password" type="password" autocomplete="current-password" placeholder="{{t('login.password_ph')}}" required></label>
        <button class="btn primary full login-submit">{{t('login.signin')}}</button>
      </form>
      <div class="login-footer"><span>{{t('login.footer_left',site='TBS')}}</span><small>Developed by Edwin Mohamad</small></div>
    </div>
  </section>
</div></body></html>
