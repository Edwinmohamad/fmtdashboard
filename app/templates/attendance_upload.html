{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><span class="eyebrow">{{t('att.eyebrow')}}</span><h1>{{t('upl.title')}}</h1><p>{{t('upl.sub')}}</p></div>
  <a class="btn" href="/attendance">{{t('upl.back')}}</a>
</div>
<div class="panel upload-hero-card">
  <form class="stack" id="attendanceUploadForm" method="post" enctype="multipart/form-data" action="/attendance/upload" data-upload-form>
    <label class="dropzone modern-drop" id="attendanceDropzone">
      <input id="attendancePdfInput" type="file" name="pdfs" accept="application/pdf,.pdf" multiple required>
      <div class="drop-icon"><svg viewBox="0 0 24 24"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 15v4h14v-4"/></svg></div>
      <b>{{t('upl.drop')}}</b>
      <span>{{t('upl.drop_sub')}}</span>
      <small>{{t('upl.max')}}</small>
    </label>
    <div id="uploadFileList" class="upload-file-list" hidden></div>
    <div id="uploadError" class="alert danger" hidden></div>
    <div class="form-grid upload-meta-grid">
      <label>{{t('upl.period')}}<input name="period" placeholder="{{t('upl.period_ph')}}" required></label>
      <label>{{t('upl.site')}}<input name="location" value="{{settings.get('site','TBS')}}" required></label>
      <label>{{t('upl.division')}}<input name="division" value="{{settings.get('division','FMT')}}" required></label>
      <label>{{t('upl.notes')}}<input name="notes" placeholder="{{t('upl.notes_ph')}}"></label>
    </div>
    <div class="upload-progress" id="uploadProgress" hidden><div><span id="uploadProgressBar"></span></div><small id="uploadProgressText">{{t('upl.preparing')}}</small></div>
    <div class="form-actions"><a class="btn" href="/attendance">{{t('common.cancel')}}</a><button id="attendanceUploadBtn" class="btn primary" type="submit">{{t('upl.submit')}}</button></div>
  </form>
</div>
{% endblock %}
