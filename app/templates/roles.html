{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">{{t('roles.eyebrow')}}</span><h1>{{t('roles.title')}}</h1><p>{{t('roles.sub')}}</p></div></div><form method="post" action="/roles"><div class="panel table-wrap"><table class="permission-table"><thead><tr><th>{{t('roles.th.permission')}}</th>{% for role in roles %}<th>{{vl(role)}}</th>{% endfor %}</tr></thead><tbody>{% for perm in permissions %}<tr><td><code>{{perm}}</code></td>{% for role in roles %}<td><input type="checkbox" name="{{role}}:{{perm}}" {% if perm in matrix[role] %}checked{% endif %}></td>{% endfor %}</tr>{% endfor %}</tbody></table></div><div class="form-actions"><button class="btn primary">{{t('roles.save')}}</button></div></form>{% endblock %}
